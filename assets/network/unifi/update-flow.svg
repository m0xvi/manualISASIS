<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="Arial, sans-serif">
  <rect width="720" height="340" fill="#f8fafc"/>
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Порядок обновления UniFi (Ubuntu Server)</text>

  <!-- Step 1 -->
  <rect x="30" y="60" width="150" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">1. Бэкап</text>
  <text x="105" y="105" text-anchor="middle" font-size="11" fill="#334155">.unf + файлы</text>
  <text x="105" y="122" text-anchor="middle" font-size="11" fill="#334155">+ mongodump</text>
  <text x="105" y="139" text-anchor="middle" font-size="11" fill="#334155">+ снапшот VM</text>

  <!-- Arrow 1 -->
  <line x1="180" y1="105" x2="215" y2="105" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker></defs>

  <!-- Step 2 -->
  <rect x="220" y="60" width="150" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="295" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">2. Контроллер</text>
  <text x="295" y="105" text-anchor="middle" font-size="11" fill="#334155">Ubuntu Server</text>
  <text x="295" y="122" text-anchor="middle" font-size="11" fill="#334155">прямой .deb</text>
  <text x="295" y="139" text-anchor="middle" font-size="11" fill="#334155">Glenn R. скрипт</text>

  <!-- Arrow 2 -->
  <line x1="370" y1="105" x2="405" y2="105" stroke="#16a34a" stroke-width="2" marker-end="url(#arr2)"/>
  <defs><marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker></defs>

  <!-- Step 3 -->
  <rect x="410" y="60" width="150" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="485" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">3. Точки AP</text>
  <text x="485" y="105" text-anchor="middle" font-size="11" fill="#334155">по одной!</text>
  <text x="485" y="122" text-anchor="middle" font-size="11" fill="#334155">Web UI / Custom</text>
  <text x="485" y="139" text-anchor="middle" font-size="11" fill="#334155">SSH + SCP</text>

  <!-- Check -->
  <rect x="590" y="60" width="100" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="640" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Проверка</text>
  <text x="640" y="105" text-anchor="middle" font-size="11" fill="#334155">Connected</text>
  <text x="640" y="122" text-anchor="middle" font-size="11" fill="#334155">Wi-Fi OK</text>
  <text x="640" y="139" text-anchor="middle" font-size="11" fill="#334155">версии ✓</text>

  <!-- Warning box -->
  <rect x="30" y="180" width="660" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="360" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">&#9888; Для РФ: часть серверов Ubiquiti отдаёт 403, но обновление возможно без VPN</text>
  <text x="360" y="224" text-anchor="middle" font-size="11" fill="#7f1d1d">Закрыты: fw-download.ubnt.com • fw-update.ubnt.com • www.ui.com/downloads (apt-репо больше не обновляется)</text>
  <text x="360" y="243" text-anchor="middle" font-size="11" fill="#14532d">Открыты: dl.ui.com (.deb и прошивки) • repo.mongodb.org • api.glennr.nl • github.com</text>
  <text x="360" y="264" text-anchor="middle" font-size="11" fill="#7f1d1d">Точки: кнопка Update не работает — берите upgrade &lt;URL&gt; с dl.ui.com, Custom Upgrade или SSH/SCP</text>
  <text x="360" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">Обязательно: локальный Super Admin + SSH-пароли ДО обновления!</text>
</svg>
